name: CI-Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-binary:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build Docker image
      run: docker build . -t builder:latest

    - name: build binary
      run: |
        docker run --rm -v ${PWD}:/project builder:latest /bin/bash -c "export STROOPWAFEL_ROOT=/project && make -C wafel_core clean && make -C wafel_debug_exts clean && make -C wafel_core && make -C wafel_debug_exts && cp wafel_core/00core.elf 00core.ipx && cp wafel_debug_exts/5debug.ipx 5debug.ipx"

        
    - uses: actions/upload-artifact@v4
      with:
       name: stroopwafel-artifacts
       path: |
         *.ipx

  deploy-binary:
    needs: build-binary
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    steps:   
    - name: Get environment variables
      id: get_vars
      run: |
        echo "REPOSITORY_NAME=$(echo "$GITHUB_REPOSITORY" | awk -F / '{print $2}')" >> $GITHUB_ENV
        echo "DATETIME=$(date '+%Y%m%d-%H%M%S')" >> $GITHUB_ENV 
    
    - uses: actions/download-artifact@v4
      with:
        name: stroopwafel-artifacts
        path: artifacts

    - name: Create Release
      uses: "softprops/action-gh-release@v2"
      with:
        tag_name: ${{ env.REPOSITORY_NAME }}-${{ env.DATETIME }}
        draft: true
        prerelease: true
        generate_release_notes: true
        name: Nightly-${{ env.REPOSITORY_NAME }}-${{ env.DATETIME }}
        files: |
          artifacts/00core.ipx
          artifacts/5debug.ipx
